name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  ORG: sim-assurances

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push feedback-db
        uses: docker/build-push-action@v5
        with:
          context: ./database
          push: true
          tags: ghcr.io/sim-assurances/feedback-db:latest

      - name: Build and push feedback-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/sim-assurances/feedback-backend:${{ steps.tag.outputs.TAG }}
            ghcr.io/sim-assurances/feedback-backend:latest

      - name: Build and push feedback-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/sim-assurances/feedback-frontend:${{ steps.tag.outputs.TAG }}
            ghcr.io/sim-assurances/feedback-frontend:latest
